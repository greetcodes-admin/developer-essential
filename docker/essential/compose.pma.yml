services:
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped

    environment:
      TZ: Asia/Kolkata
      PMA_ARBITRARY: 1
      UPLOAD_LIMIT: 512M
      MEMORY_LIMIT: 512M

    networks:
      devNetwork:
        ipv4_address: 172.20.0.12

networks:
  devNetwork:
    external: true

